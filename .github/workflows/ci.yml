name: Verify store
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: gravitas-store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -cover ./... && go vet ./...
        working-directory: backend
      - run: docker compose --env-file .env.example config --quiet
        env:
          ADMIN_TOKEN: ci-placeholder-admin-token-32-characters
          WEBHOOK_SECRET: ci-placeholder-webhook-secret-32-characters
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/jeethsuresh/appstore:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jeethsuresh/appstore
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: private-store-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GRAVITAS_DEPLOY_ENABLED == 'true'
    needs: [backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: gravitas
      url: https://apps.gravitas.cool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified Kubernetes client
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure namespace-scoped deploy credential
        env:
          GRAVITAS_KUBECONFIG: ${{ secrets.GRAVITAS_KUBECONFIG }}
        run: |
          test -n "$GRAVITAS_KUBECONFIG"
          umask 077
          printf '%s' "$GRAVITAS_KUBECONFIG" > "$RUNNER_TEMP/appstore-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/appstore-kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy and verify public HTTPS
        env:
          KUBE_CONTEXT: gravitas
          RELEASE_IMAGE: ghcr.io/jeethsuresh/appstore@${{ needs.backend.outputs.digest }}
        run: deploy/gravitas/deploy.sh "$RELEASE_IMAGE"
      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/appstore-kubeconfig"
