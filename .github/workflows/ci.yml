name: Verify store
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: gravitas-store-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -cover ./... && go vet ./...
        working-directory: backend
      - run: docker compose --env-file .env.example config --quiet
        env:
          ADMIN_TOKEN: ci-placeholder-admin-token-32-characters
          WEBHOOK_SECRET: ci-placeholder-webhook-secret-32-characters
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/jeethsuresh/appstore:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jeethsuresh/appstore
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check catalog package visibility before building
        run: |
          python3 scripts/test-catalog-visibility.py
          python3 scripts/catalog_visibility.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: android
      - name: Verify catalog visibility in the compiled APK
        run: python3 scripts/catalog_visibility.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM for notification power regression
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated testbed certificate resource
        run: |
          mkdir -p android/app/build/generated/e2e-res/raw
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/notification-power-ca.key" -out android/app/build/generated/e2e-res/raw/integration_ca.pem -days 2 -subj '/CN=Notification power test CA'
          rm "$RUNNER_TEMP/notification-power-ca.key"
      - name: Test Android navigation, settings and screen-off delivery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./tools/e2e/ui-checks.sh
      - name: Preserve notification power test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-power-results
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/reports/ui/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: private-store-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: |
          python3 scripts/test-desktop-release.py
          python3 scripts/desktop-release.py validate
      - run: npm test
        working-directory: desktop
      - name: Exercise desktop login, install, updates and self-update staging
        run: xvfb-run -a npm run test:e2e
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-flow-results
          path: desktop/test-results
          if-no-files-found: ignore
  desktop-packages:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x64}
          - {os: ubuntu-24.04, platform: linux, arch: arm64}
          - {os: macos-15, platform: mac, arch: x64}
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: windows-2022, platform: win, arch: x64}
          - {os: windows-2022, platform: win, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.AppImage
          if-no-files-found: error
  desktop-publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, android, desktop, desktop-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop/dist
          merge-multiple: true
      - name: Publish the complete verified release with its changelog
        run: python3 scripts/desktop-release.py publish
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, android, desktop, desktop-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: gravitas
      url: "https://apps.gravitas.cool"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned private deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/gravitas-deploy
          ref: 1672e6fef247f5ba36ed07ac178dc41482cddaba
          path: .gravitas-runtime
          ssh-key: ${{ secrets.GRAVITAS_TOOLING_SSH_KEY }}
          persist-credentials: false
      - name: Deploy and verify immutable release
        uses: ./.gravitas-runtime
        with:
          config: .gravitas/deploy.json
          image: ghcr.io/jeethsuresh/appstore@${{ needs.backend.outputs.digest }}
          kubeconfig: ${{ secrets.GRAVITAS_KUBECONFIG }}
