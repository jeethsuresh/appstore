name: Apple timestamp connectivity diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/diagnose-apple-timestamp'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe public Apple timestamp routes without signing credentials
        run: python3 scripts/probe-apple-timestamp.py
