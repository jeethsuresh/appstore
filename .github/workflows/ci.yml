name: Verify store
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -cover ./... && go vet ./...
        working-directory: backend
      - run: docker compose --env-file .env.example config --quiet
        env:
          ADMIN_TOKEN: ci-placeholder-admin-token-32-characters
          WEBHOOK_SECRET: ci-placeholder-webhook-secret-32-characters
      - run: docker build -t private-store-ci .
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: private-store-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
