name: Provision Railyard Mac signing identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal-signing-identity:
    if: github.repository == 'jeethsuresh/appstore' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: macos-release
    steps:
      - name: Install the sealed-box implementation
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsodium23
      - name: Encrypt only for Railyard's protected Mac environment
        env:
          RECIPIENT_KEY_ID: '3380204578043523366'
          RECIPIENT_PUBLIC_KEY: 'ophA/V8TT/kTrJHlAip/1Uq0OQcsb8TBgMSqmlpJpTc='
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64, ctypes, ctypes.util, json, os, pathlib
          key = base64.b64decode(os.environ['RECIPIENT_PUBLIC_KEY'], validate=True)
          if len(key) != 32: raise ValueError('Invalid Railyard public key')
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          if sodium.sodium_init() < 0: raise RuntimeError('libsodium initialization failed')
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          sealed = {}
          for name in ('MAC_CERTIFICATE_P12_BASE64', 'MAC_CERTIFICATE_PASSWORD'):
              value = os.environ[name].encode()
              if not value: raise ValueError('Missing required signing identity')
              output = ctypes.create_string_buffer(len(value) + 48)
              if sodium.crypto_box_seal(output, value, len(value), key) != 0:
                  raise RuntimeError('Signing identity encryption failed')
              sealed[name] = base64.b64encode(output.raw).decode()
          result = dict(repository='jeethsuresh/railyard', environment='macos-release', key_id=os.environ['RECIPIENT_KEY_ID'], secrets=sealed)
          pathlib.Path('railyard-signing-sealed.json').write_text(json.dumps(result)+'\n', encoding='utf-8')
          print('Encrypted two signing secrets for the fixed Railyard environment public key.')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: railyard-signing-sealed
          path: railyard-signing-sealed.json
          if-no-files-found: error
          retention-days: 1
