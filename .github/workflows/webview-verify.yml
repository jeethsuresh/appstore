name: Verify Work and News
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android:
    name: WebView Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          python3 scripts/test-webview-release.py
          python3 scripts/webview-release.py validate
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug testWorkDebugUnitTest testNewsDebugUnitTest lintWorkDebug lintNewsDebug
        working-directory: webview-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify WebView history and left/right Android gestures
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb shell dumpsys deviceidle unforce
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell input keyevent KEYCODE_HOME
            adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural
            adb shell settings put secure navigation_mode 2
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay list --user 0
            adb shell dumpsys activity service com.android.systemui/.SystemUIService
            cd webview-android && ./gradlew --no-daemon connectedWorkDebugAndroidTest connectedNewsDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: webview-tests-${{ matrix.api }}
          path: |
            webview-android/app/build/reports/
            webview-android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
