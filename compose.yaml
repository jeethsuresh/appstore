services:
  store:
    build: .
    restart: unless-stopped
    init: true
    environment:
      LISTEN_ADDR: ':8080'
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Generate an admin token in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Generate a webhook secret in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NOTIFICATION_PUBLIC_URL: ${NOTIFICATION_PUBLIC_URL:-}
      NOTIFICATION_APP_KEYS: ${NOTIFICATION_APP_KEYS:-}
      DATA_DIR: /data
      APPS_CONFIG: /etc/private-store/apps.json
    volumes:
      - store_data:/data
      - ./config/apps.json:/etc/private-store/apps.json:ro
    healthcheck:
      test: ["CMD", "store", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    expose:
      - '8080'
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      options:
        max-size: '10m'
        max-file: '3'
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:?Set the public store hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      store:
        condition: service_healthy
    logging:
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  store_data:
  caddy_data:
  caddy_config:
